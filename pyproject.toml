[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prediction-analyzer-py"
version = "0.1.0"
description = "Python rewrite scaffold for prediction analyzer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "polars>=1.7.0",
  "fsspec>=2024.6.1",
  "s3fs>=2024.6.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
